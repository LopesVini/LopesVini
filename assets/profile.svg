    <style>
        .card {
            fill: #161b22;
        }

        .ascii {
            fill: #d0d7de;
            font-family:
                "Courier New",
                "Liberation Mono",
                monospace;
            font-size: 11.48px;
            font-weight: 700;
            white-space: pre;
            letter-spacing: 0;
        }

        .title,
        .label,
        .value,
        .section {
            font-family:
                "Courier New",
                "Liberation Mono",
                monospace;
            font-weight: 700;
        }

        .title {
            fill: #d0d7de;
            font-size: 25px;
        }

        .label {
            fill: #ffa657;
            font-size: 19px;
        }

        .value {
            fill: #a5d6ff;
            font-size: 19px;
        }

        .bullet {
            fill: #6e7681;
            font-family: monospace;
            font-size: 20px;
            font-weight: 700;
        }

        .section {
            fill: #d0d7de;
            font-size: 20px;
        }

        .leader {
            stroke: #6e7681;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-dasharray: 1 12;
        }

        .header-line,
        .section-line {
            stroke: #d0d7de;
            stroke-width: 2;
        }
    </style>

    <rect
        class="card"
        width="1600"
        height="900"
        rx="28"
